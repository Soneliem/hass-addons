# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Dashboard2EPaper
version: "1.0.0"
slug: dashboard2epaper
description: Capture Home Assistant dashboards and serve optimized images for e-paper displays
url: "https://github.com/Soneliem/dashboard2epaper/tree/main/dashboard2epaper"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "HTTP API for e-paper device integration"
# map:
#   - type: addon_config
#     read_only: false
options:
  dashboard_url: "http://supervisor/core/api/panel_custom/dashboard"
  update_interval: 5
  display_width: 800
  display_height: 600
  dithering: true
  contrast_adjustment: 1.0
  access_token: ""
  log_level: "info"
schema:
  dashboard_url: "url"
  update_interval: "int(1,1440)"
  display_width: "int(100,2000)"
  display_height: "int(100,2000)"
  dithering: "bool"
  contrast_adjustment: "float(0.1,3.0)"
  access_token: "str?"
  log_level: "list(debug|info|warn|error)"
# image: "ghcr.io/home-assistant/{arch}-addon-example"
